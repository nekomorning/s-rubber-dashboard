<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合成胶数据看板 · 核心逻辑</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --border:#e5e9f0; --text:#1f2733; --sub:#6b7686;
  --up:#d92626; --down:#0a9a5c; --flat:#8a93a3; --accent:#0f4c81; --focus:#2b7cff;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; font-size:14px;}
.wrap{max-width:1560px; margin:0 auto; padding:18px 22px 60px;}
.header{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.header h1{font-size:24px; color:var(--accent); letter-spacing:1px;}
.header .date{color:var(--sub); font-size:13px;}
.tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:7px 20px; border-radius:8px 8px 0 0; border:1px solid var(--border); border-bottom:none;
  background:#e9edf3; color:var(--sub); cursor:default; font-size:14px; text-decoration:none;}
.tab.active{background:var(--accent); color:#fff; font-weight:600;}
.sec-title{font-size:18px; color:var(--accent); font-weight:700; margin:24px 0 6px;}
.sec-sub{color:var(--sub); font-size:13px; margin:0 0 12px;}
/* 定价逻辑 */
.logic{background:var(--card); border:1px solid var(--border); border-left:4px solid var(--accent);
  border-radius:10px; padding:16px 20px; line-height:1.9; margin-top:6px;}
.logic ul{list-style:none; padding:0; margin:0;}
.logic li{position:relative; padding-left:18px; margin:8px 0; color:var(--text); font-size:16px; line-height:1.6;}
.logic li::before{content:"●"; position:absolute; left:2px; color:var(--accent); font-size:9px; top:6px;}
.logic b{color:var(--accent);}
/* 年份筛选 */
.ybar{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 14px;}
.ybtn{display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border-radius:16px;
  border:1px solid var(--border); background:#fff; color:var(--sub); font-size:13px; cursor:pointer;}
.ybtn .dot{width:10px; height:10px; border-radius:50%;}
.ybtn.off{opacity:.35; filter:grayscale(.6);}
/* 顶部工具条 */
.topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px;}
.topbar .sec-sub{margin:0; flex:1; min-width:260px;}
.abtn{padding:6px 14px; border:1px solid var(--border); background:#fff; border-radius:8px; cursor:pointer; font-size:13px; color:var(--accent);}
.abtn:hover{background:#eef3f9;}
.abtn.saved{color:#0a9a5c; border-color:#0a9a5c; background:#f0faf4;}
/* 图表栅格（一行四个）+ 行标题 */
.grid{display:grid; gap:14px;}
.grid.c4{grid-template-columns:repeat(4,1fr);}
.crow{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
.crow .row-note{grid-column:1/-1; font-size:18px; color:var(--accent); font-weight:700; background:transparent; border:none; border-bottom:1px solid var(--border); border-radius:0; padding:8px 4px; min-height:34px; outline:none; cursor:text; line-height:1.5; margin-bottom:4px;}
.crow .row-note:focus{border-bottom-color:var(--accent); color:var(--accent);}
.crow .row-note:empty::before{content:attr(data-ph); color:#b3bcc9; font-weight:400;}
.logic-tools{display:flex; gap:8px; margin:24px 0 6px;}
@media (max-width:1200px){ .grid.c4{grid-template-columns:repeat(2,1fr);} .crow{grid-template-columns:repeat(2,1fr);} }
@media (max-width:720px){ .grid.c4{grid-template-columns:1fr;} .crow{grid-template-columns:1fr;} .wrap{padding:12px 10px 40px;} }
.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px 6px; min-width:0; position:relative;}
.card.focus{box-shadow:0 0 0 2px var(--focus); border-color:var(--focus);}
.card.empty{border-style:dashed; display:flex; align-items:center; justify-content:center; min-height:230px;}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:6px; margin:0 0 4px; cursor:grab; position:relative;}
.card-head .ttl{font-size:14px; font-weight:700; color:#2a3345; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.4;}
.menu-btn{width:24px; height:22px; display:inline-flex; align-items:center; justify-content:center; padding:0; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer; color:var(--sub); font-size:14px; line-height:1; flex-shrink:0;}
.menu-btn:hover{background:#f0f3f8; color:var(--accent); border-color:var(--accent);}
.menu{position:absolute; top:calc(100% + 4px); right:0; background:#fff; border:1px solid var(--border); border-radius:8px; padding:4px; box-shadow:0 4px 12px rgba(0,0,0,.12); display:none; flex-direction:column; gap:2px; z-index:10; min-width:92px;}
.menu.show{display:flex;}
.menu button{font-size:12px; line-height:1.2; padding:5px 8px; border:1px solid transparent; background:#fff; border-radius:6px; cursor:pointer; color:var(--sub); text-align:left; white-space:nowrap;}
.menu button:hover{background:#f0f3f8; color:var(--accent); border-color:var(--border);}
.menu button.on{background:var(--focus); color:#fff; border-color:var(--focus);}
.card .meta{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:4px 0 2px;}
.card .val{font-size:20px; font-weight:700;}
.card .unit{font-size:11px; color:var(--sub);}
.card .chg{font-size:13px; font-weight:600;}
.card .chg.up{color:var(--up);} .card .chg.down{color:var(--down);} .card .chg.flat{color:var(--flat);}
.card .dt{font-size:11px; color:var(--sub);}
.card .chart{width:100%; height:220px;}
.card .chart.pe{height:auto; margin-top:2px;}
.card .chart.pe .pe-img{width:100%; height:auto; display:block; border-radius:6px; border:1px solid var(--border); background:#fff;}
.card.empty .pick{padding:12px 18px; border:1px dashed var(--border); background:#fafbfd; border-radius:10px; cursor:pointer; color:var(--sub); font-size:14px;}
.card.empty .pick:hover{color:var(--accent); border-color:var(--accent);}
.card .err{color:#c0392b; font-size:12px; padding:10px 4px;}
/* 选择图表 modal */
.modal{position:fixed; inset:0; background:rgba(20,30,45,.45); display:none; align-items:center; justify-content:center; z-index:50;}
.modal-box{background:#fff; width:min(660px,92vw); max-height:82vh; border-radius:12px; display:flex; flex-direction:column; overflow:hidden;}
.modal-head{padding:12px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; font-weight:700;}
.modal-head button{border:none; background:none; font-size:18px; cursor:pointer; color:var(--sub); line-height:1;}
.modal-search{padding:10px 16px; border-bottom:1px solid var(--border);}
.modal-search input{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px;}
.modal-list{overflow:auto; padding:8px 10px 16px;}
.src-group{font-size:12px; color:var(--sub); padding:10px 6px 4px; font-weight:700;}
.src-sub{font-size:11px; color:var(--sub); padding:8px 6px 2px; font-weight:600;}
.chart-item{padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13px; border:1px solid transparent; display:flex; justify-content:space-between; gap:10px;}
.chart-item:hover{background:#f0f3f8; border-color:var(--border);}
.chart-item .k{color:var(--sub); font-size:11px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>合成胶数据看板 · 核心逻辑</h1>
    <div class="date" id="dataDate">数据加载中…</div>
  </div>
  <div class="tabs">
    <a class="tab active" href="https://nekomorning.github.io/s-rubber-dashboard/core.html">核心逻辑</a>
    <a class="tab" href="https://nekomorning.github.io/s-rubber-dashboard/balance.html">平衡表</a>
    <a class="tab" href="https://nekomorning.github.io/s-rubber-dashboard/p3.html">贸易流</a>
    <a class="tab" href="https://nekomorning.github.io/s-rubber-dashboard/capacity.html">产能投放</a>
    <a class="tab" href="https://nekomorning.github.io/s-rubber-dashboard/maint.html">装置检修</a>
    <a class="tab" href="https://nekomorning.github.io/s-rubber-dashboard/p2.html">开工库存表需</a>
    <a class="tab" href="https://nekomorning.github.io/s-rubber-dashboard/p1.html">日度价格</a>
    <a class="tab" href="https://nekomorning.github.io/s-rubber-dashboard/weekly.html">周报</a>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
    <h2 class="sec-title" style="margin:24px 0 6px;">定价逻辑</h2>
    <div class="logic-tools">
      <button class="abtn" id="editLogic">✎ 编辑</button>
      <button class="abtn" id="historyLogic">🕘 历史</button>
    </div>
  </div>
  <div class="logic" id="logicBox">
    <ul id="logicList"></ul>
  </div>

  <h2 class="sec-title">核心数据跟踪图表</h2>
  <div class="topbar">
    <span class="sec-sub">数据来源于各看板页（日度价格 / 开工库存 / 贸易流），跟随每日刷新同步更新 · 点卡片右上角按钮可自定义（✎选择 / ∅清空 / ↑↓排序 / ☆关注蓝框 / ✕删除），卡片可拖拽排序</span>
    <button class="abtn" id="addCard">＋ 新增卡片</button>
    <button class="abtn" id="saveLayout">💾 保存布局</button>
    <button class="abtn" id="saveContent">💾 保存内容</button>
  </div>
  <div class="ybar" id="ybar"></div>
  <div id="charts"></div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-head"><span>选择图表</span><button id="modalClose">✕</button></div>
      <div class="modal-search"><input id="modalSearch" placeholder="搜索图表名称…"></div>
      <div class="modal-list" id="modalList"></div>
    </div>
  </div>

  <div class="modal" id="modalLogic" style="display:none">
    <div class="modal-box">
      <div class="modal-head"><span>编辑定价逻辑</span><button id="logicClose">✕</button></div>
      <div class="modal-search" style="font-size:12px;color:var(--sub)">每行一条。三种加粗标记：<code>**红**</code> 红色加粗 · <code>@@蓝@@</code> 蓝色加粗 · <code>%%绿%%</code> 绿色加粗。行首「供应：/需求：/核心：」自动蓝色加粗。</div>
      <div class="modal-list" style="padding:10px 16px 16px;">
        <textarea id="logicInput" style="width:100%; height:150px; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:14px; line-height:1.7; font-family:inherit; resize:vertical; box-sizing:border-box;"></textarea>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
          <button class="abtn" id="logicSave">保存</button>
          <button class="abtn" id="logicCancel">取消</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="modalHistory" style="display:none">
    <div class="modal-box">
      <div class="modal-head"><span>定价逻辑 · 历史编辑记录</span><button id="historyClose">✕</button></div>
      <div class="modal-list" id="historyList" style="padding:10px 16px 16px;"></div>
    </div>
  </div>
</div>

<script>
(function loadECharts(){
  var urls=[
    "echarts.min.js",
    "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
    "https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js",
    "https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"
  ];
  var i=0;
  function tryNext(){
    if(i>=urls.length){document.getElementById("charts").innerHTML="<div style='padding:20px;color:#c00'>ECharts 加载失败，请检查网络后刷新。</div>";return;}
    var s=document.createElement("script");
    s.src=urls[i++];
    s.onload=function(){ window.echarts ? init() : tryNext(); };
    s.onerror=tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();

var DEFAULT_DAILY=["PE-原油价差","PE-石脑油价差","丁二烯-石脑油价差","BR-丁二烯价差"];
var YEAR_COLORS={ "2016":"#94a3b8","2017":"#60a5fa","2018":"#34d399","2019":"#fbbf24","2020":"#f472b6","2021":"#12B5A6","2022":"#8B5CF6","2023":"#1E6FFF","2024":"#F59A23","2025":"#E60000","2026":"#1A1A1A" };
function yearColor(y){ return YEAR_COLORS[String(y)] || "#888888"; }
function fmt(v,dec){ if(v===null||v===undefined) return "—"; return Number(v).toLocaleString("zh-CN",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function chgCls(c){ if(c===null||c===undefined||c===0) return "flat"; return c>0?"up":"down"; }
function arrow(c){ if(c===null||c===undefined||c===0) return "→"; return c>0?"▲":"▼"; }
function monthTicks(xlabels){ var idx={}; xlabels.forEach(function(l,i){ if(l.slice(3)==="01") idx[i]=parseInt(l.slice(0,2),10)+"月"; }); return idx; }
function uid(){ return "c"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }

/* 多数据源 */
var SOURCES={
  daily:{label:"日度价格", url:"rubber_data_p1.json", indicators:null, xlabels:null, years:null, date:null},
  kai:{label:"开工库存", url:"rubber_data_p2.json", indicators:null, xlabels:null, years:null, date:null},
  trade:{label:"贸易流（月度季节图）", url:"butadiene_trade.json", indicators:null, trade:null},
  pe:{label:"PE日报（图片）", url:"pe_daily.json", indicators:null}
};

var allYears=[], yearVisible={}, charts=[], layout=[], dragFrom=null, currentPickIdx=null;
var LS_KEY="coreLayoutV1";
var LS_SAVED_KEY="coreLayoutV1_saved";
var CONTENT_KEY="coreContentV1";
var CONTENT_SAVED_KEY="coreContentV1_saved";

/* 定价逻辑默认文本（每行一条；**文字** = 红色加粗；行首“供应：/需求：/核心：”自动加粗蓝色） */
var DEFAULT_LOGIC=[
  "供应：**原料是核心变量（快变量）**，丁二烯开工、进出口、合成胶出口都是结果",
  "需求：下游调节去应对供应（慢变量），来自价差需求（天胶-合成、丁二烯区域价差）",
  "核心：石脑油（原料缺不缺）、LPG（原料轻质化出率低的影响）"
];
var logicText=null;    // null=使用默认；保存后为数组
var rowNotes=[];       // [{cardId, text}] 行标题，按行内第一张卡的 uid 锚定
var logicHistory=[];   // [{date, text:[]}] 定价逻辑编辑历史（最新在前）

function defaultLayout(){
  // 默认布局卡片用固定 id（d1~d4），保证行标题锚定稳定（不受每次刷新重新生成随机 id 影响）
  return DEFAULT_DAILY.map(function(k, i){ return {id:"d"+(i+1), src:"daily", key:k, focus:false}; });
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(layout)); }catch(e){} }
function loadLayout(){
  function read(k){
    try{
      var s=localStorage.getItem(k);
      if(s){ var a=JSON.parse(s); if(Array.isArray(a)){ return a.map(function(it){ return {id:it.id||uid(), src:it.src||"daily", key:it.key||null, focus:!!it.focus}; }); } }
    }catch(e){}
    return null;
  }
  // 优先级：用户主动保存的快照 > 自动保存 > 默认
  return read(LS_SAVED_KEY) || read(LS_KEY) || defaultLayout();
}

function fetchJson(u){
  return fetch(u,{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
}

/* ---- 定价逻辑 / 行标题 / 保存内容 ---- */
function esc(s){ var d=document.createElement("div"); d.textContent=(s==null?"":String(s)); return d.innerHTML; }
function logicLineToHtml(line){
  var s=esc(line);
  s=s.replace(/^([供应需求核心价格供需]+\s*[:：])/, '<b>$1</b>');
  s=s.replace(/\*\*([^*]+)\*\*/g, '<span style="color:#e0301e;font-weight:700">$1</span>');
  s=s.replace(/@@([^@]+)@@/g, '<span style="color:#0f4c81;font-weight:700">$1</span>');
  s=s.replace(/%%([^%]+)%%/g, '<span style="color:#0a9a5c;font-weight:700">$1</span>');
  return s;
}
function renderLogic(){
  var list=document.getElementById("logicList");
  if(!list) return;
  var lines=logicText||DEFAULT_LOGIC;
  list.innerHTML="";
  lines.forEach(function(line){
    var li=document.createElement("li");
    li.innerHTML=logicLineToHtml(line);
    list.appendChild(li);
  });
}
function rowNoteFor(cardId){
  for(var i=0;i<rowNotes.length;i++){ if(rowNotes[i].cardId===cardId) return rowNotes[i]; }
  return null;
}
function setRowNote(cardId, text){
  var rn=rowNoteFor(cardId);
  if(rn){ rn.text=text; } else { rowNotes.push({cardId:cardId, text:text}); }
  saveContentAuto();
}
function contentPayload(){
  return {logic: logicText||DEFAULT_LOGIC, rowNotes: rowNotes, history: logicHistory,
          savedAt: new Date().toLocaleString('zh-CN')};
}
function saveContentAuto(){ try{ localStorage.setItem(CONTENT_KEY, JSON.stringify(contentPayload())); }catch(e){} }
function loadContent(){
  var data=null;
  try{ var s=localStorage.getItem(CONTENT_SAVED_KEY); if(s) data=JSON.parse(s); }catch(e){}
  if(!data){ try{ var s2=localStorage.getItem(CONTENT_KEY); if(s2) data=JSON.parse(s2); }catch(e){} }
  if(data){
    if(Array.isArray(data.logic)&&data.logic.length) logicText=data.logic;
    if(Array.isArray(data.rowNotes)) rowNotes=data.rowNotes;
    if(Array.isArray(data.history)) logicHistory=data.history;
  }
  renderLogic();
}
function openLogicEdit(){
  var ta=document.getElementById("logicInput");
  ta.value=(logicText||DEFAULT_LOGIC).join("\n");
  document.getElementById("modalLogic").style.display="flex";
  setTimeout(function(){ ta.focus(); }, 50);
}
function closeLogicEdit(){ document.getElementById("modalLogic").style.display="none"; }
function saveLogicEdit(){
  var raw=document.getElementById("logicInput").value;
  var lines=raw.split("\n").map(function(s){return s.trim();}).filter(Boolean);
  if(!lines.length) return;
  if(JSON.stringify(lines)!==JSON.stringify(logicText||DEFAULT_LOGIC)){
    logicHistory.unshift({date:new Date().toLocaleString('zh-CN'), text:lines.slice()});
    if(logicHistory.length>50) logicHistory.pop();
  }
  logicText=lines.slice();
  saveContentAuto();
  renderLogic();
  closeLogicEdit();
}
function openLogicHistory(){
  var list=document.getElementById("historyList");
  list.innerHTML="";
  if(!logicHistory.length){
    list.innerHTML='<div style="padding:20px;color:var(--sub);text-align:center">暂无历史记录（编辑并保存定价逻辑后自动记录）</div>';
    document.getElementById("modalHistory").style.display="flex";
    return;
  }
  logicHistory.forEach(function(h){
    var item=document.createElement("div");
    item.style.cssText='border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#fafbfd;';
    var hd=document.createElement("div");
    hd.style.cssText='font-size:12px; color:var(--accent); font-weight:700; margin-bottom:6px;';
    hd.textContent=h.date;
    item.appendChild(hd);
    var ul=document.createElement("ul");
    ul.style.cssText='list-style:none; padding:0; margin:0;';
    h.text.forEach(function(line){
      var li=document.createElement("li");
      li.style.cssText='font-size:13px; color:var(--text); padding-left:14px; position:relative; margin:3px 0;';
      li.innerHTML='<span style="position:absolute; left:0; color:var(--accent);">●</span>'+logicLineToHtml(line);
      ul.appendChild(li);
    });
    item.appendChild(ul);
    var rb=document.createElement("button");
    rb.className="abtn"; rb.textContent="恢复此版本";
    rb.style.cssText='margin-top:8px; font-size:12px; padding:3px 10px;';
    rb.onclick=function(){ logicText=h.text.slice(); saveContentAuto(); renderLogic(); openLogicHistory(); };
    item.appendChild(rb);
    list.appendChild(item);
  });
  document.getElementById("modalHistory").style.display="flex";
}

/* ---- 贸易流：从 butadiene_trade.json 构建 indicators（月度季节图，不含桑基/堆积） ---- */
const monthLabels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
function parseMonth(m){ var p=m.match(/(\d{4})-M(\d{2})/); return p?p.slice(1):null; }
function buildSeasonSeries(seriesObj){
  const byYear={};
  Object.keys(seriesObj||{}).forEach(function(k){
    var v=seriesObj[k]; if(v===null||v===undefined) return;
    var ym=parseMonth(k); if(!ym) return;
    var y=ym[0], mn=parseInt(ym[1],10);
    if(!byYear[y]) byYear[y]=[];
    byYear[y][mn-1]=v;
  });
  return Object.keys(byYear).sort().map(function(y){return {name:y, data:byYear[y]};});
}
function latestNonNull(seriesObj){
  const keys=Object.keys(seriesObj||{}).sort();
  for(var i=keys.length-1;i>=0;i--){ var v=seriesObj[keys[i]]; if(v!==null&&v!==undefined) return {date:keys[i], value:v}; }
  return null;
}
function prevMonth(m){ var p=m.match(/(\d{4})-M(\d{2})/); if(!p) return null; var y=+p[1], mn=+p[2]; if(mn===1){y-=1;mn=12;}else{mn-=1;} return y+"-M"+(mn<10?"0":"")+mn; }
function sameMonthLastYear(m){ var p=m.match(/(\d{4})-M(\d{2})/); if(!p) return null; return (parseInt(p[1],10)-1)+"-M"+p[2]; }
function calcStats(seriesObj){
  var l=latestNonNull(seriesObj); if(!l) return null;
  var prev=seriesObj[prevMonth(l.date)];
  var yoy=seriesObj[sameMonthLastYear(l.date)];
  var chg=(prev===null||prev===undefined)?null:(l.value-prev);
  var pct=(prev===null||prev===undefined||prev===0)?null:((l.value-prev)/prev*100);
  var yoyChg=(yoy===null||yoy===undefined)?null:(l.value-yoy);
  var yoyPct=(yoy===null||yoy===undefined||yoy===0)?null:((l.value-yoy)/yoy*100);
  return {latest:l.value, date:l.date, chg:chg, pct:pct, yoyChg:yoyChg, yoyPct:yoyPct};
}
function buildTradeIndicators(trade){
  var out={};
  // 国名/地区名中英映射（贸易流当前均为丁二烯）
  var NAME_MAP={
    "Korea":"韩国", "Korea_Rep":"韩国",
    "China":"中国",
    "Taiwan":"中国台湾",
    "Japan":"日本",
    "USA":"美国", "United States":"美国",
    "EU":"欧盟", "European Union":"欧盟",
    "SEAsia":"东南亚", "Southeast Asia":"东南亚"
  };
  function cnName(k, display){ return NAME_MAP[k] || NAME_MAP[display] || display || k; }
  function addSection(map, prefix){
    Object.keys(map).forEach(function(k){
      var rec=map[k]; if(!rec) return;
      var disp=cnName(k, rec.display||k);
      ["Export","Import"].forEach(function(fl){
        var so=rec[fl]&&rec[fl].total;
        if(so) out[prefix+k+"|"+fl]={ title: "丁二烯-"+disp+(fl==="Export"?"出口量":"进口量"), unit:"吨", dec:0, seriesObj:so, src:"trade" };
      });
      var ex=rec.Export&&rec.Export.total, im=rec.Import&&rec.Import.total;
      if(ex&&im){
        var net={};
        Object.keys(ex).forEach(function(m){ net[m]=(ex[m]||0)-(im[m]||0); });
        out[prefix+k+"|Net"]={ title: "丁二烯-"+disp+"净出口量", unit:"吨", dec:0, seriesObj:net, src:"trade" };
      }
    });
  }
  addSection(trade.reporters||{}, "");
  addSection(trade.regions||{}, "");
  return out;
}
function tradeYears(trade){
  var s=new Set();
  [trade.reporters, trade.regions].forEach(function(map){
    if(!map) return;
    Object.keys(map).forEach(function(k){
      var rec=map[k]; if(!rec) return;
      ["Export","Import"].forEach(function(fl){
        var so=rec[fl]&&rec[fl].total; if(so) Object.keys(so).forEach(function(m){ s.add(m.slice(0,4)); });
      });
    });
  });
  return Array.from(s).sort();
}

function init(){
  Promise.allSettled([ fetchJson(SOURCES.daily.url), fetchJson(SOURCES.kai.url), fetchJson(SOURCES.trade.url), fetchJson(SOURCES.pe.url) ])
    .then(function(res){
      if(res[0].status==="fulfilled"){ var d=res[0].value; SOURCES.daily.indicators=d.indicators; SOURCES.daily.xlabels=d.xlabels; SOURCES.daily.years=d.years; SOURCES.daily.date=d.latestDataDate; }
      if(res[1].status==="fulfilled"){ var d2=res[1].value; SOURCES.kai.indicators=d2.indicators; SOURCES.kai.xlabels=d2.xlabels; SOURCES.kai.years=d2.years; }
      if(res[2].status==="fulfilled"){ SOURCES.trade.trade=res[2].value; SOURCES.trade.indicators=buildTradeIndicators(res[2].value); }
      if(res[3].status==="fulfilled"){ var p=res[3].value; SOURCES.pe.indicators=(p&&p.indicators)?p.indicators:{}; }
      // 年份并集
      var ys=new Set();
      [SOURCES.daily.years, SOURCES.kai.years].forEach(function(arr){ (arr||[]).forEach(function(y){ ys.add(String(y)); }); });
      if(SOURCES.trade.trade) tradeYears(SOURCES.trade.trade).forEach(function(y){ ys.add(y); });
      allYears=Array.from(ys).sort();
      var n=allYears.length;
      allYears.forEach(function(y,i){ yearVisible[y]=(i>=n-4); });
      document.getElementById("dataDate").textContent="数据截至 "+(SOURCES.daily.date||"");
      buildYearBar();
      loadContent();
      layout=loadLayout();
      renderAll();
    })
    .catch(function(e){ document.getElementById("charts").innerHTML="<div style='padding:20px;color:#c00'>初始化失败："+e.message+"</div>"; });
}

/* 日序季节图（日度价格 / 开工库存 复用） */
function drawSeason(div, ind, xlabels, years){
  var c=echarts.init(div);
  var ticks=monthTicks(xlabels);
  var n=years.length, series=[], legend=[];
  years.forEach(function(y){
    if(!yearVisible[y]) return;  // 只渲染当前选中的年份
    var pts=ind.series[String(y)];
    if(!pts||!pts.length) return;
    legend.push(String(y));
    var isLatest=(y===years[n-1]);
    series.push({
      name:String(y), type:"line", showSymbol:false, connectNulls:true, data:pts,
      lineStyle:{width:isLatest?2.2:1.4, color:yearColor(y)},
      itemStyle:{color:yearColor(y)}, emphasis:{focus:"series"}, z:isLatest?10:5,
      endLabel:{show:isLatest, fontSize:10, color:yearColor(y), formatter:function(p){ return fmt(p.value[1], ind.dec); }}
    });
  });
  c.setOption({
    animation:false,
    grid:{left:8,right:14,top:26,bottom:4,containLabel:true},
    legend:{show:true, top:0, right:0, itemWidth:14, itemHeight:2, icon:"rect", textStyle:{fontSize:11,color:"#6b7686"}, data:legend},
    tooltip:{trigger:"axis", confine:true, formatter:function(ps){
      if(!ps.length) return "";
      var lab=xlabels[ps[0].value[0]];
      var s=parseInt(lab.slice(0,2),10)+"月"+parseInt(lab.slice(3),10)+"日";
      ps.sort(function(a,b){return Number(b.seriesName)-Number(a.seriesName);});
      ps.forEach(function(p){ s+="<br>"+p.marker+p.seriesName+"年： <b>"+fmt(p.value[1],ind.dec)+"</b>"; });
      return s;
    }},
    xAxis:{type:"value", min:0, max:365, interval:1, axisLabel:{fontSize:10,color:"#8a93a3", formatter:function(v){ return ticks[v]||""; }}, axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}}, splitLine:{show:false}},
    yAxis:{type:"value", scale:true, axisLabel:{fontSize:10,color:"#8a93a3", formatter:function(v){ return Math.abs(v)>=10000?(v/10000)+"万":(Math.abs(v)>=1000?(v/1000)+"k":v); }}, splitLine:{lineStyle:{color:"#eef1f6"}}},
    series:series
  });
  charts.push(c);
}

/* 月序季节图（贸易流） */
function drawSeasonMonth(div, seriesObj, dec){
  var c=echarts.init(div);
  var series=buildSeasonSeries(seriesObj);
  var years=series.map(function(s){return s.name;});
  var sorted=series.slice().sort(function(a,b){return parseInt(a.name)-parseInt(b.name);})
    .filter(function(s){ return !!yearVisible[s.name]; });
  c.setOption({
    animation:false,
    tooltip:{trigger:"axis", confine:true, formatter:function(ps){
      if(!ps.length) return "";
      var s=ps[0].axisValue;
      ps.sort(function(a,b){return Number(b.seriesName)-Number(a.seriesName);});
      ps.forEach(function(p){ s+="<br>"+p.marker+p.seriesName+"年： <b>"+fmt(p.value,dec)+"</b>"; });
      return s;
    }},
    legend:{data:sorted.map(function(s){return s.name;}), bottom:0, left:"center", textStyle:{fontSize:10}, itemWidth:10, itemHeight:5, itemGap:6},
    grid:{left:36,right:14,top:14,bottom:42,containLabel:true},
    xAxis:{type:"category", data:monthLabels, axisLine:{lineStyle:{color:"#ccc"}}, axisLabel:{fontSize:10}},
    yAxis:{type:"value", axisLine:{show:false}, splitLine:{lineStyle:{color:"#f0f0f0"}}, axisLabel:{fontSize:10, formatter:function(v){return Math.abs(v)>=1000?(v/1000).toFixed(1)+"k":v;}}},
    series: sorted.map(function(s){
      var isLast = s.name === years[years.length-1];
      return {name:s.name, type:"line", smooth:true, symbol:"none", data:s.data, connectNulls:true,
        lineStyle:{width:isLast?2.2:1.5, color:yearColor(s.name)}, itemStyle:{color:yearColor(s.name)}, z:isLast?10:5};
    })
  });
  charts.push(c);
}

function renderAll(){
  charts.forEach(function(c){ try{ c.dispose(); }catch(e){} });
  charts=[];
  var root=document.getElementById("charts");
  root.innerHTML="";
  if(!layout.length){
    root.innerHTML='<div style="padding:30px;color:#6b7686">暂无卡片，点击上方「＋ 新增卡片」添加。</div>';
    return;
  }
  var GROUP=4;
  for(var i=0;i<layout.length;i+=GROUP){
    var group=layout.slice(i,i+GROUP);
    var row=document.createElement("div"); row.className="crow";
    // 行标题：可编辑小结（按组首卡片 uid 锚定）
    var firstId=group[0].id;
    var note=document.createElement("div");
    note.className="row-note"; note.contentEditable="true";
    note.setAttribute("data-ph","本行小结：点击输入总结 / 结论…");
    var rn=rowNoteFor(firstId);
    if(rn&&rn.text) note.textContent=rn.text;
    (function(cid, el){
      el.addEventListener("input", function(){ setRowNote(cid, el.textContent); });
      el.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
    })(firstId, note);
    row.appendChild(note);
    group.forEach(function(item, gi){ row.appendChild(makeCard(item, i+gi)); });
    root.appendChild(row);
  }
  // 等 DOM 回流完成、容器有尺寸后再初始化图表
  setTimeout(renderCardCharts, 0);
}

function renderCardCharts(){
  document.querySelectorAll(".card .chart").forEach(function(div){
    var cfg=div._chart; if(!cfg) return;
    if(cfg.src==="trade") drawSeasonMonth(div, cfg.ind.seriesObj, cfg.dec);
    else drawSeason(div, cfg.ind, cfg.xlabels, cfg.years);
    delete div._chart;
  });
}

function makeCard(item, idx){
  var card=document.createElement("div");
  card.className="card"+(item.focus?" focus":"")+(item.key?"":" empty");

  var srcKey=item.src||"daily";
  var S=SOURCES[srcKey];
  var ind=(S && S.indicators && item.key && S.indicators[item.key]) ? S.indicators[item.key] : null;

  if(ind){
    // 卡片头部：标题 + ⋯ 菜单
    var head=document.createElement("div"); head.className="card-head"; head.draggable=true;
    var ttl=document.createElement("div"); ttl.className="ttl"; ttl.textContent=ind.title;
    var menuBtn=document.createElement("button"); menuBtn.className="menu-btn"; menuBtn.title="操作"; menuBtn.innerHTML="⋯";
    var menu=document.createElement("div"); menu.className="menu";
    menu.innerHTML='<button data-act="pick" title="选择图表">✎ 选择</button>'+
      '<button data-act="clear" title="清空为空白">∅ 清空</button>'+
      '<button data-act="up" title="上移">↑ 上移</button>'+
      '<button data-act="down" title="下移">↓ 下移</button>'+
      '<button data-act="focus" title="关注(蓝框)" class="'+(item.focus?"on":"")+'">'+(item.focus?"★ 关注":"☆ 关注")+'</button>'+
      '<button data-act="del" title="删除">✕ 删除</button>';
    head.appendChild(ttl); head.appendChild(menuBtn); head.appendChild(menu);
    card.appendChild(head);

    var dec=ind.dec, meta, div;
    if(srcKey==="pe"){
      /* PE日报：图片卡片（标题 + 最新/环比/更新日期 + 图片） */
      var latestTxt=ind.latest!==undefined&&ind.latest!==''?String(ind.latest):'';
      var chgTxt=ind.chg!==undefined&&ind.chg!==''?String(ind.chg):'';
      var dateTxt=ind.date?('更新 '+ind.date):'';
      var cls=chgTxt.indexOf('-')===0?'down':(chgTxt?'up':'');
      meta=document.createElement("div"); meta.className="meta";
      meta.innerHTML='<span class="val">'+(latestTxt||'—')+'<span class="unit"> '+(ind.unit||'')+'</span></span>'+
        (chgTxt?'<span class="chg '+cls+'">'+arrow(parseFloat(chgTxt))+' '+chgTxt+'</span>':'')+
        '<span class="dt">'+dateTxt+'</span>';
      div=document.createElement("div"); div.className="chart pe";
      var img=document.createElement("img"); img.className="pe-img"; img.src=ind.file; img.alt=ind.title; img.loading="lazy";
      div.appendChild(img);
    } else {
      var st, cls2, sign, latestTxt2, chgTxt2, pctTxt2, dateTxt2;
      if(srcKey==="trade"){
        var cs=calcStats(ind.seriesObj); st=cs;
        latestTxt2=fmt(cs?cs.latest:null,dec);
        cls2=chgCls(cs?cs.chg:null); sign=(cs&&cs.chg>0?"+":"");
        chgTxt2=(!cs||cs.chg===null?"":sign+fmt(cs.chg,dec));
        pctTxt2=(!cs||cs.pct===null?"—":sign+cs.pct.toFixed(2)+"%");
        dateTxt2=cs?cs.date:"";
      } else {
        st=ind.stat||{};
        latestTxt2=fmt(st.latest,dec);
        cls2=chgCls(st.chg); sign=(st.chg>0?"+":"");
        chgTxt2=(st.chg===null?"":sign+fmt(st.chg,dec));
        pctTxt2=(st.pct===null?"—":sign+st.pct.toFixed(2)+"%");
        dateTxt2=st.latestDate||"";
      }
      var chgVal = (srcKey==="trade") ? (cs?cs.chg:null) : st.chg;
      var pctStr = (srcKey==="trade") ? (cs&&cs.pct!==null?cs.pct.toFixed(2)+"%":"—") : pctTxt2;
      meta=document.createElement("div"); meta.className="meta";
      meta.innerHTML='<span class="val">'+latestTxt2+'<span class="unit"> '+ind.unit+'</span></span>'+
        '<span class="chg '+cls2+'">'+arrow(chgVal)+' '+chgTxt2+'（'+pctStr+'）</span>'+
        '<span class="dt">'+dateTxt2+'</span>';
      div=document.createElement("div"); div.className="chart";
      // 延迟到 DOM 挂载后再初始化 ECharts，否则容器尺寸为 0 导致空白
      div._chart={src:srcKey, ind:ind, xlabels:S.xlabels, years:S.years, dec:dec};
    }
    card.appendChild(meta); card.appendChild(div);

    menuBtn.addEventListener("click", function(e){
      e.stopPropagation();
      // 先关闭其他卡片的菜单
      document.querySelectorAll(".card .menu.show").forEach(function(m){ if(m!==menu) m.classList.remove("show"); });
      menu.classList.toggle("show");
    });
    menu.addEventListener("click", function(e){
      e.stopPropagation();
      var b=e.target.closest("button"); if(!b) return;
      var act=b.getAttribute("data-act");
      if(act==="pick") openPicker(idx);
      else if(act==="clear"){ layout[idx].key=null; save(); renderAll(); }
      else if(act==="up" && idx>0){ var t=layout[idx-1]; layout[idx-1]=layout[idx]; layout[idx]=t; save(); renderAll(); }
      else if(act==="down" && idx<layout.length-1){ var t=layout[idx+1]; layout[idx+1]=layout[idx]; layout[idx]=t; save(); renderAll(); }
      else if(act==="focus"){ layout[idx].focus=!layout[idx].focus; save(); renderAll(); }
      else if(act==="del"){ layout.splice(idx,1); save(); renderAll(); }
    });
    head.addEventListener("dragstart", function(e){ dragFrom=idx; e.dataTransfer.effectAllowed="move"; });
  } else if(item.key){
    var err=document.createElement("div"); err.className="err"; err.textContent="（该图表数据源未加载："+srcKey+"）";
    card.appendChild(err);
  } else {
    var ph=document.createElement("button"); ph.className="pick"; ph.textContent="＋ 点击选择图表";
    ph.onclick=function(){ openPicker(idx); };
    card.appendChild(ph);
  }
  card.addEventListener("dragover", function(e){ e.preventDefault(); });
  card.addEventListener("drop", function(e){
    e.preventDefault();
    if(dragFrom===null || dragFrom===idx) return;
    var it=layout.splice(dragFrom,1)[0];
    layout.splice(idx,0,it); dragFrom=null; save(); renderAll();
  });
  card.addEventListener("dragend", function(){ dragFrom=null; });
  return card;
}

/* 选择图表 modal */
function openPicker(idx){
  currentPickIdx=idx;
  document.getElementById("modalSearch").value="";
  renderPickerList("");
  document.getElementById("modal").style.display="flex";
}
function closePicker(){ document.getElementById("modal").style.display="none"; currentPickIdx=null; }
function renderPickerList(q){
  q=(q||"").trim();
  var list=document.getElementById("modalList");
  list.innerHTML="";
  var groups=[
    {src:"daily", label:"日度价格", inds:SOURCES.daily.indicators},
    {src:"kai", label:"开工库存", inds:SOURCES.kai.indicators},
    {src:"trade", label:"贸易流（月度季节图）", inds:SOURCES.trade.indicators},
    {src:"pe", label:"PE日报（图片）", inds:SOURCES.pe.indicators}
  ];
  function addItem(g,k){
    var ind=g.inds[k];
    var it=document.createElement("div"); it.className="chart-item";
    it.innerHTML='<span>'+ind.title+'</span><span class="k">'+k+'</span>';
    it.onclick=function(){
      if(currentPickIdx!==null) layout[currentPickIdx]={id:uid(), src:g.src, key:k, focus:false};
      save(); closePicker(); renderAll();
    };
    list.appendChild(it);
  }
  groups.forEach(function(g){
    if(!g.inds) return;
    var keys=Object.keys(g.inds);
    if(q) keys=keys.filter(function(k){ var ind=g.inds[k]; return (k.indexOf(q)>=0)||(ind.title&&ind.title.indexOf(q)>=0); });
    if(!keys.length) return;
    var gh=document.createElement("div"); gh.className="src-group";
    gh.textContent=g.label+"（"+keys.length+"）";
    list.appendChild(gh);
    if(g.src==="pe"){
      // PE 日报按板块子分组
      var bySec={};
      keys.forEach(function(k){ var s=g.inds[k].section||"其他"; (bySec[s]=bySec[s]||[]).push(k); });
      Object.keys(bySec).forEach(function(s){
        var sh=document.createElement("div"); sh.className="src-sub"; sh.textContent=s+"（"+bySec[s].length+"）";
        list.appendChild(sh);
        bySec[s].forEach(function(k){ addItem(g,k); });
      });
    } else {
      keys.forEach(function(k){ addItem(g,k); });
    }
  });
  if(!list.children.length){
    var empty=document.createElement("div"); empty.className="src-group"; empty.textContent="无匹配 / 数据源未加载";
    list.appendChild(empty);
  }
}

function buildYearBar(){
  var bar=document.getElementById("ybar");
  bar.innerHTML="";
  allYears.forEach(function(y){
    var b=document.createElement("button");
    b.className="ybtn"+(yearVisible[y]?"":" off");
    b.innerHTML='<span class="dot" style="background:'+yearColor(y)+'"></span>'+y+'年';
    b.onclick=function(){
      yearVisible[y]=!yearVisible[y];
      b.classList.toggle("off",!yearVisible[y]);
      renderAll();  // 按可见年份重新渲染全部卡片
    };
    bar.appendChild(b);
  });
}
